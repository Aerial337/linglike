name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Unit tests (parsers, renderer)
        run: go test ./...
      - name: Vet (Windows target)
        run: GOOS=windows GOARCH=amd64 go vet ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build Windows executables
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/linglike.exe ./cmd/linglike
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/lingcli.exe ./cmd/lingcli
          cp README.md dist/
          mkdir -p dist/dictionaries
          echo "Put your .ld2 / .mdx / .ifo / .txt dictionaries in this folder (or add them from Options > Dictionaries)." > dist/dictionaries/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linglike-windows-amd64
          path: dist/
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd dist && zip -r ../linglike-windows-amd64.zip .
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linglike-windows-amd64.zip
